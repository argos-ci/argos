name: Release
permissions: {}

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize releases: a concurrent deploy to the same ECS service supersedes
# the in-flight one, which the deploy action reports as a failure.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  AWS_REGION: us-east-1
  ECS_CLUSTER: argos-production
  ECR_REPOSITORY: argos/app
  ECR_CACHE_TAG: buildcache
  ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
  ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
  # Assets are served from their own origin, which retains every recent build.
  # A task only ever holds the build baked into its image, so serving hashed
  # assets from the app itself 404s them mid-rollout and for every tab still
  # holding an older shell. Baked into the image at build time and read again by
  # the running container, which has to authorise the origin in its CSP.
  ASSETS_BASE_URL: https://assets.argos-ci.com
  ASSETS_BUCKET: argos-assets-production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.value }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify deployment start
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          title: "Production deployment started"
          description: "[GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # The Dockerfile's last stage is `dist`, a scratch image holding only
          # the frontend build output. Without this the default target applies
          # and the pushed "app" image is that empty scratch image.
          target: build
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.ECR_CACHE_TAG }}
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.ECR_CACHE_TAG }},mode=max
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            ASSETS_BASE_URL=${{ env.ASSETS_BASE_URL }}

      # Lifts the frontend build out of the image that was just built. Every
      # layer is already in this job's buildx cache, so this resolves without
      # rebuilding anything.
      - name: Export frontend assets
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=frontend-dist
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.ECR_CACHE_TAG }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            ASSETS_BASE_URL=${{ env.ASSETS_BASE_URL }}

      # Only `assets/` — the content-hashed output. Public-directory files keep
      # their stable names and stay on the app origin (see `renderBuiltUrl` in
      # apps/frontend/vite.config.mts), so they are deliberately not here.
      - name: Upload built assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-assets
          path: frontend-dist/assets
          retention-days: 1
          if-no-files-found: error

      - name: Export image reference
        id: image
        run: echo "value=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Publishes the build's hashed assets to the CDN *before* anything serves HTML
  # that names them. `deploy` waits on this job for exactly that reason.
  #
  # Nothing here ever deletes: the bucket is append-only, so the assets of every
  # recent build stay reachable and a rollback to an older image keeps working.
  # Retention is handled out of band by the purge Lambda in infra/.
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-assets
          path: assets

      # `--no-delete` is the default and is relied on: an object already present
      # is the *same* object, since the name is a hash of the content. Repeat
      # deploys of an unchanged chunk are a no-op.
      - name: Sync assets to S3
        run: |
          set -euo pipefail
          aws s3 sync assets "s3://$ASSETS_BUCKET/assets/" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # The retention job reads these. It keeps every key named by a manifest
      # younger than its window and deletes the rest, which is what makes it
      # safe: an unchanged chunk keeps its hash across builds and is skipped by
      # `s3 sync`, so its S3 creation date goes stale while it is still
      # referenced. Age of the *manifest*, never age of the object.
      - name: Write build manifest
        run: |
          set -euo pipefail
          find assets -type f -printf 'assets/%P\n' | jq -R . | jq -s \
            --arg sha "$GITHUB_SHA" \
            '{sha: $sha, keys: .}' > manifest.json
          aws s3 cp manifest.json "s3://$ASSETS_BUCKET/manifests/$GITHUB_SHA.json" \
            --cache-control "no-cache" \
            --no-progress

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare migration task definition
        id: prepare-task-def
        run: |
          set -euo pipefail
          PREPARED_TASK_DEF="$RUNNER_TEMP/argos-migrate.task-definition.json"
          sed \
            -e "s|__TASK_ROLE_ARN__|$ECS_TASK_ROLE_ARN|g" \
            -e "s|__EXECUTION_ROLE_ARN__|$ECS_TASK_EXECUTION_ROLE_ARN|g" \
            aws/tasks/argos-migrate.json > "$PREPARED_TASK_DEF"
          echo "task-definition=$PREPARED_TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Fill in task definition for migration
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: ${{ steps.prepare-task-def.outputs.task-definition }}
          container-name: argos-migrate
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            NODE_ENV=production
          secrets: |
            DATABASE_URL=/production/database_url
            ENCRYPTION_KEY=/production/encryption_key

      - name: Run ECS migration task
        env:
          TASK_DEF_FILE: ${{ steps.task-def.outputs.task-definition }}
        run: |
          set -euo pipefail

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TASK_DEF_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          SUBNETS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services argos-app \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' \
            --output json | jq -r 'join(",")')

          SECURITY_GROUPS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services argos-app \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' \
            --output json | jq -r 'join(",")')

          ASSIGN_PUBLIC_IP=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services argos-app \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp' \
            --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
            --started-by "github-actions-release-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' \
            --output text)

          # ECS forgets a stopped task about an hour after it stops. Name it now,
          # so a run opened the next morning still says what to go looking for.
          echo "Task: $TASK_ARN (log stream ecs/argos-migrate/${TASK_ARN##*/} in /ecs/argos-migrate)"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          TASK=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --output json)

          # Null rather than a number whenever the container never ran at all,
          # which the reasons below explain and the migration logs never do.
          EXIT_CODE=$(jq -r '.tasks[0].containers[0].exitCode // "none"' <<<"$TASK")

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code: $EXIT_CODE"
            jq -r '.tasks[0] | "Stopped reason: \(.stoppedReason // "-")", "Container reason: \(.containers[0].reason // "-")"' <<<"$TASK"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `assets` gates this: the CDN must already hold the chunks the shell this
    # image serves will name.
    needs: [build, migrate, assets]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: argos-app
            task-definition: aws/tasks/argos-app.json
            container-name: argos-app
          - service: argos-worker
            task-definition: aws/tasks/argos-worker.json
            container-name: argos-worker

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare task definition
        id: prepare-task-def
        run: |
          set -euo pipefail
          PREPARED_TASK_DEF="$RUNNER_TEMP/${{ matrix.container-name }}.task-definition.json"
          sed \
            -e "s|__TASK_ROLE_ARN__|$ECS_TASK_ROLE_ARN|g" \
            -e "s|__EXECUTION_ROLE_ARN__|$ECS_TASK_EXECUTION_ROLE_ARN|g" \
            "${{ matrix.task-definition }}" > "$PREPARED_TASK_DEF"
          echo "task-definition=$PREPARED_TASK_DEF" >> "$GITHUB_OUTPUT"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: ${{ steps.prepare-task-def.outputs.task-definition }}
          container-name: ${{ matrix.container-name }}
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            NODE_ENV=production
            API_BASE_URL=https://api.argos-ci.com
            MCP_BASE_URL=https://mcp.argos-ci.com
            SERVER_URL=https://app.argos-ci.com
            SENTRY_RELEASE_VERSION=${{ github.sha }}
            ASSETS_BASE_URL=${{ env.ASSETS_BASE_URL }}
          secrets: |
            AMQP_URL=/production/amqp_url
            AWS_ACCESS_KEY_ID=/production/aws_access_key_id
            AWS_SECRET_ACCESS_KEY=/production/aws_secret_access_key
            DATABASE_URL=/production/database_url
            DEPLOYMENTS_CLOUDFLARE_ZONE_ID=/production/deployments_cloudflare_zone_id
            DEPLOYMENTS_CLOUDFLARE_API_TOKEN=/production/deployments_cloudflare_api_token
            DEPLOYMENTS_ACCESS_TOKEN_SECRET=/production/deployments_access_token_secret
            DISCORD_WEBHOOK_URL=/production/discord_webhook_url
            ENCRYPTION_KEY=/production/encryption_key
            GITHUB_APP_ID=/production/github_app_id
            GITHUB_APP_PRIVATE_KEY=/production/github_app_private_key
            GITHUB_APP_URL=/production/github_app_url
            GITHUB_CLIENT_ID=/production/github_client_id
            GITHUB_CLIENT_SECRET=/production/github_client_secret
            GITHUB_LIGHT_APP_ID=/production/github_light_app_id
            GITHUB_LIGHT_APP_PRIVATE_KEY=/production/github_light_app_private_key
            GITHUB_LIGHT_APP_URL=/production/github_light_app_url
            GITHUB_LIGHT_WEBHOOK_SECRET=/production/github_light_webhook_secret
            GITHUB_PROXY_URL=/production/github_proxy_url
            GITHUB_SSO_STRIPE_PRODUCT_ID=/production/github_sso_stripe_product_id
            GITHUB_WEBHOOK_SECRET=/production/github_webhook_secret
            GITLAB_APP_ID=/production/gitlab_app_id
            GITLAB_APP_SECRET=/production/gitlab_app_secret
            GITLAB_ARGOS_AUTH_SECRET=/production/gitlab_argos_auth_secret
            GOOGLE_CLIENT_ID=/production/google_client_id
            GOOGLE_CLIENT_SECRET=/production/google_client_secret
            ORIGIN_APP_ID=/production/origin_app_id
            ORIGIN_APP_PRIVATE_KEY=/production/origin_app_private_key
            REDIS_URL=/production/redis_url
            RESEND_API_KEY=/production/resend_api_key
            RESEND_WEBHOOK_SECRET=/production/resend_webhook_secret
            SAML_SSO_STRIPE_PRODUCT_ID=/production/saml_sso_stripe_product_id
            SCREENSHOT_STRIPE_PRODUCT_ID=/production/screenshot_stripe_product_id
            SENTRY_AUTH_TOKEN=/production/sentry_auth_token
            SENTRY_CLIENT_DSN=/production/sentry_client_dsn
            SENTRY_SERVER_DSN=/production/sentry_server_dsn
            SERVER_SESSION_SECRET=/production/server_session_secret
            SLACK_CLIENT_ID=/production/slack_client_id
            SLACK_CLIENT_SECRET=/production/slack_client_secret
            SLACK_SIGNING_SECRET=/production/slack_signing_secret
            SLACK_STATE_SECRET=/production/slack_state_secret
            SQIDS_ALPHABET=/production/sqids_alphabet
            STORYBOOK_SCREENSHOT_STRIPE_PRODUCT_ID=/production/storybook_screenshot_stripe_product_id
            STRIPE_API_KEY=/production/stripe_api_key
            STRIPE_WEBHOOK_SECRET=/production/stripe_webhook_secret

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  notify-migration-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: migrate
    if: ${{ always() && needs.migrate.result == 'failure' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify migration failure
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          title: "Production migration failed"
          description: "Migration failed - [GitHub Actions logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          color: "15548997"

  notify-deploy-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify deployment failure
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          title: "Production deployment failed"
          description: "Deploy failed - [GitHub Actions logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          color: "15548997"

  notify-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify deployment success
        uses: ./.github/actions/notify-discord
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          title: "Production deployment succeeded"
          description: "[GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          color: "5763719"
