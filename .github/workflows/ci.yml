name: CI
permissions: {}

on:
  push:
    branches: [main]
  # Any base branch, not just `main`, so a pull request stacked on another one
  # is checked while it is still stacked rather than only once its base merges
  # and GitHub retargets it.
  pull_request:
    branches: ["**"]

# No TURBO_TOKEN: the remote cache only holds artifacts signed with the release
# workflow's key, which CI cannot verify or produce, so turbo caches locally.
env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

# The organization's plan runs 20 jobs at once, across every repository, and a
# run takes 11. A pull request pushed again cancels its previous run instead of
# queueing behind it. Pushes to `main` each get a group of their own: every
# commit there needs its Argos builds, the baselines of later pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Short checks share a job with the others needing the same install and build:
# each job spends a minute on checkout, install and build before running any.
jobs:
  static-analysis-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build
        id: build
        run: pnpm exec -- turbo run build --filter=\!@argos/frontend

      - name: Run static checks
        run: pnpm exec -- turbo run static-checks

      - name: Run unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test:unit
        env:
          NODE_ENV: test
          TZ: UTC
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGOS_TOKEN: ${{ secrets.ARGOS_STORYBOOK_TOKEN }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      # Codegen and the workspace packages: Storybook builds the frontend from
      # its sources.
      - name: Setup
        id: setup
        run: pnpm exec -- turbo run build --filter=@argos/frontend^...

      # In the background: the build keeps the CPU busy while the browser
      # install below waits on the network, and publishing waits on the network
      # while the stories run. Published even when a story fails, so it can be
      # looked at in the deployed Storybook.
      - name: Build and publish Storybook
        run: |
          (
            set +e
            pnpm --dir apps/frontend run build-storybook &&
              pnpm --dir apps/frontend run deploy-storybook
            echo $? > "$RUNNER_TEMP/storybook-exit"
          ) > "$RUNNER_TEMP/storybook.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/storybook-pid"

      # Headless Chromium runs the headless shell, so the full browser is not
      # needed.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run Storybook tests
        run: pnpm --dir apps/frontend run test-storybook
        # Not job-wide: `storybook build` defaults NODE_ENV to production only
        # when it is unset.
        env:
          NODE_ENV: test
          TZ: UTC

      - name: Wait for Storybook to publish
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pid=$(cat "$RUNNER_TEMP/storybook-pid")
          while kill -0 "$pid" 2> /dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/storybook.log"
          if [ ! -f "$RUNNER_TEMP/storybook-exit" ]; then
            echo "Storybook build was interrupted." >&2
            exit 1
          fi
          exit "$(cat "$RUNNER_TEMP/storybook-exit")"

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services
        run: scripts/ci-services.sh start

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      # Codegen and the workspace packages: tests run the backend from its
      # sources.
      - name: Setup
        run: pnpm exec -- turbo run build --filter='./packages/*'

      - name: Wait for services
        run: scripts/ci-services.sh wait

      - name: Test
        run: pnpm run test:integration --shard=${{ matrix.shard }}/3

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      API_BASE_URL: http://localhost:3000
      NODE_ENV: test
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-jammy

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services
        run: scripts/ci-services.sh start

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      # Pulled in the background, so it downloads while the app builds. A
      # `docker://` step would pull it before the job's first step, and pulled
      # from the first step, it slowed the dependency download down.
      - name: Pull Playwright image
        run: docker pull --quiet "$PLAYWRIGHT_IMAGE" > /dev/null 2>&1 &

      - name: Build
        run: pnpm exec -- turbo run build
        env:
          BUILD_MODE: production

      - name: Wait for services
        run: scripts/ci-services.sh wait

      - name: Create database
        run: pnpm --filter @argos/backend run setup

      # The workspace and RUNNER_TEMP are mounted at their own paths, so the
      # GITHUB_* variables pointing into them — the event payload the Argos
      # reporter reads, for one — resolve inside the container too.
      #
      # The web server runs in the container and reaches the services by their
      # container names. A broker that does not resolve blocks anything that
      # enqueues a job (submitting a build review, say) forever, and the
      # request that triggered it never answers.
      - name: Run Playwright tests
        env:
          REDIS_URL: redis://redis:6379/1
          DATABASE_URL: postgresql://postgres@postgres/test
          AMQP_URL: amqp://rabbitmq
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          # Joins the background pull, or retries it if it failed.
          docker pull --quiet "$PLAYWRIGHT_IMAGE"
          github_env=()
          for name in $(compgen -e | grep '^GITHUB_'); do
            github_env+=(--env "$name")
          done
          docker run --rm \
            --network services \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            "${github_env[@]}" \
            --env CI \
            --env API_BASE_URL \
            --env NODE_ENV \
            --env TZ \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env ARGOS_TOKEN \
            --env REDIS_URL \
            --env DATABASE_URL \
            --env AMQP_URL \
            "$PLAYWRIGHT_IMAGE" \
            npm run test:e2e -- --shard="$SHARD"

  # The image only gets built on release otherwise, so a file the runtime stage
  # forgets to copy would first show up as a failed deploy.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action's build record would add an artifact to every run.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # In the background, so they download while the image builds.
      - name: Pull the services the image check runs
        run: scripts/check-image.sh --pull > /dev/null 2>&1 &

      # The runner's Docker keeps images in containerd, so its own builder
      # reads and writes the Actions cache: a buildx builder would cost ~45s to
      # export the image back into Docker. Only the dependency stages are
      # cached, as they change with the lockfile alone: a layer already in the
      # cache is not uploaded again, and the rest changes on every commit.
      - name: Cache dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod-deps
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,scope=docker-image,mode=max

      # Uncompressed: the image goes no further than this runner's Docker.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: ASSETS_BASE_URL=https://assets.argos-ci.com
          outputs: type=image,name=argos:ci,unpack=true,compression=uncompressed
          cache-from: type=gha,scope=docker-image

      - name: Check image
        run: scripts/check-image.sh argos:ci

  test-gate:
    name: test
    runs-on: ubuntu-latest
    needs:
      [
        static-analysis-and-unit-test,
        storybook,
        integration-test,
        e2e-test,
        docker-image,
      ]
    if: ${{ always() }}

    steps:
      - name: Fail if any test job failed or was cancelled
        run: |
          if [ "${{ needs.static-analysis-and-unit-test.result }}" != "success" ] || \
             [ "${{ needs.storybook.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ] || \
             [ "${{ needs.e2e-test.result }}" != "success" ] || \
             [ "${{ needs.docker-image.result }}" != "success" ]; then
            echo "At least one test job did not succeed"
            exit 1
          fi
