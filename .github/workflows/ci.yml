name: CI
permissions: {}

on:
  push:
    branches: [main]
  # Any base branch, not just `main`, so a pull request stacked on another one
  # is checked while it is still stacked rather than only once its base merges
  # and GitHub retargets it.
  pull_request:
    branches: ["**"]

# No TURBO_TOKEN: the remote cache only holds artifacts signed with the release
# workflow's key, which CI cannot verify or produce, so turbo caches locally.
env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

# The organization's plan runs 20 jobs at once, across every repository, and a
# run takes 10. A pull request pushed again cancels its previous run instead of
# queueing behind it. Pushes to `main` each get a group of their own: every
# commit there needs its Argos builds, the baselines of later pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Short checks share a job with the others needing the same install and build:
# each job spends a minute on checkout, install and build before running any.
jobs:
  static-analysis-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build
        id: build
        run: pnpm exec -- turbo run build --filter=\!@argos/frontend

      - name: Run static checks
        run: pnpm exec -- turbo run static-checks

      - name: Run unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test:unit
        env:
          NODE_ENV: test
          TZ: UTC
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGOS_TOKEN: ${{ secrets.ARGOS_STORYBOOK_TOKEN }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        id: setup
        run: pnpm run build
        env:
          BUILD_MODE: production

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests
        run: pnpm --dir apps/frontend run test-storybook
        # Not job-wide: `storybook build` defaults NODE_ENV to production only
        # when it is unset.
        env:
          NODE_ENV: test
          TZ: UTC

      # Published even when a story fails, so it can be looked at in the
      # deployed Storybook.
      - name: Build Storybook
        id: build-storybook
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --dir apps/frontend run build-storybook

      - name: Publish Storybook to Argos
        if: ${{ !cancelled() && steps.build-storybook.outcome == 'success' }}
        run: pnpm --dir apps/frontend run deploy-storybook

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6380:6379
        # Speed up initialization by disabling health checks
        # Services run during the installation of the dependencies
        # options: >-
        #   --health-cmd "redis-cli ping"
        #   --health-interval 10s
        #   --health-timeout 5s
        #   --health-retries 5

      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # Speed up initialization by disabling health checks
        # Services run during the installation of the dependencies
        # options: >-
        #   --health-cmd "pg_isready"
        #   --health-interval 10s
        #   --health-timeout 5s
        #   --health-retries 5

      rabbit:
        # Keep in sync with docker-compose.yml and production (Amazon MQ 4.2).
        image: rabbitmq:4.2-alpine
        ports:
          - 5672:5672
        # Speed up initialization by disabling health checks
        # Services run during the installation of the dependencies
        # options: >-
        #   --health-cmd "rabbitmq-diagnostics -q ping"
        #   --health-interval 10s
        #   --health-timeout 5s
        #   --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        run: pnpm run setup
        env:
          BUILD_MODE: production

      - name: Test
        run: pnpm run test:integration --shard=${{ matrix.shard }}/3

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      API_BASE_URL: http://localhost:3000
      NODE_ENV: test
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-jammy

    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6380:6379
        # Speed up initialization by disabling health checks
        # Services run during the installation of the dependencies
        # options: >-
        #   --health-cmd "redis-cli ping"
        #   --health-interval 10s
        #   --health-timeout 5s
        #   --health-retries 5

      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # Speed up initialization by disabling health checks
        # Services run during the installation of the dependencies
        # options: >-
        #   --health-cmd "pg_isready"
        #   --health-interval 10s
        #   --health-timeout 5s
        #   --health-retries 5

      # Named after the host in `AMQP_URL` below: the web server runs inside
      # the Playwright container and reaches services by their label. Without
      # it, anything that enqueues a job — submitting a build review, say —
      # blocks forever on a broker that does not resolve, and the request that
      # triggered it never answers.
      rabbitmq:
        # Keep in sync with docker-compose.yml and production (Amazon MQ 4.2).
        image: rabbitmq:4.2-alpine
        ports:
          - 5672:5672

    steps:
      # A `docker://` step would pull the image before the job's first step,
      # holding everything up for half a minute. Pulled in the background, it
      # downloads while dependencies install and the app builds.
      - name: Pull Playwright image
        run: docker pull --quiet "$PLAYWRIGHT_IMAGE" > /dev/null 2>&1 &

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js & install dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup
        run: pnpm run setup
        env:
          BUILD_MODE: production

      # The workspace and RUNNER_TEMP are mounted at their own paths, so the
      # GITHUB_* variables pointing into them — the event payload the Argos
      # reporter reads, for one — resolve inside the container too.
      - name: Run Playwright tests
        env:
          REDIS_URL: redis://redis:6379/1
          DATABASE_URL: postgresql://postgres@postgres/test
          AMQP_URL: amqp://rabbitmq
          NETWORK: ${{ job.services.postgres.network }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Joins the background pull, or retries it if it failed.
          docker pull --quiet "$PLAYWRIGHT_IMAGE"
          github_env=()
          for name in $(compgen -e | grep '^GITHUB_'); do
            github_env+=(--env "$name")
          done
          # HOME=/root: Firefox fails on permissions otherwise
          # https://github.com/microsoft/playwright/issues/6500
          docker run --rm \
            --network "$NETWORK" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            "${github_env[@]}" \
            --env CI \
            --env HOME=/root \
            --env API_BASE_URL \
            --env NODE_ENV \
            --env TZ \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env ARGOS_TOKEN \
            --env REDIS_URL \
            --env DATABASE_URL \
            --env AMQP_URL \
            "$PLAYWRIGHT_IMAGE" \
            npm run test:e2e -- --shard="$SHARD/3"

  # The image only gets built on release otherwise, so a file the runtime stage
  # forgets to copy would first show up as a failed deploy.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's Docker builds with BuildKit already. A buildx builder, as in
      # the release workflow, is only worth it for a registry cache: here it
      # cost ~45s to export the image back into Docker and tear itself down.
      - name: Build image
        run: docker build --target runtime --tag argos:ci --build-arg ASSETS_BASE_URL=https://assets.argos-ci.com .

      - name: Check image
        run: scripts/check-image.sh argos:ci

  test-gate:
    name: test
    runs-on: ubuntu-latest
    needs:
      [
        static-analysis-and-unit-test,
        storybook,
        integration-test,
        e2e-test,
        docker-image,
      ]
    if: ${{ always() }}

    steps:
      - name: Fail if any test job failed or was cancelled
        run: |
          if [ "${{ needs.static-analysis-and-unit-test.result }}" != "success" ] || \
             [ "${{ needs.storybook.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ] || \
             [ "${{ needs.e2e-test.result }}" != "success" ] || \
             [ "${{ needs.docker-image.result }}" != "success" ]; then
            echo "At least one test job did not succeed"
            exit 1
          fi
