name: "Setup deps"
description: "Install Node.js and dependencies"
runs:
  using: "composite"
  steps:
    # `node_modules` as `pnpm install` leaves it. With an unchanged lockfile,
    # restoring it skips both the store download and the install, which spent
    # 12 seconds linking packages.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          infra/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}

    # Installs pnpm's own binary and the Node.js version in `.nvmrc`. Node.js 25
    # and later no longer ship Corepack, and installing it from npm took five
    # seconds.
    - name: Install pnpm and Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        install: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        require-lockfile: true

    # Saved right after the install rather than at the end of the job, so the
    # caches tools write into `node_modules` later on are not part of it.
    - name: Save node_modules
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          infra/node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
