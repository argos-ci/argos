packages:
  - apps/*
  - packages/*
  - infra

catalog:
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  eslint: ^10.8.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.0
  zod: ^4.4.3

overrides:
  '@types/react': "catalog:"
  '@types/react-dom': "catalog:"
  dompurify: ^3.4.0
  esbuild: ^0.28.1
  file-type: ^21.3.2
  graphql: 16.14.2
  ip-address: ^10.1.1
  lodash: ^4.17.23
  lodash-es: ^4.18.1
  minimatch: ^10.2.6
  react: "catalog:"
  react-dom: "catalog:"
  react-router: "catalog:"
  sharp: ^0.35.1
  uuid: ^14.0.0
  undici: ^8.10.0
  ws: ^8.20.1

allowBuilds:
  "@apollo/protobufjs": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@tailwindcss/oxide": true
  esbuild: true
  # Its postinstall refetches the domain list from three remote sources and
  # rewrites domains.json, so the installed content would vary per install and
  # escape the lockfile — and the install fails outright whenever a source is
  # down. Blocked: we take the deterministic published snapshot instead, and
  # top it up in src/util/public-email-domains.ts.
  free-email-domains: false
  msw: true
  odiff-bin: true
  oxc-resolver: true
  sharp: true

minimumReleaseAgeExclude:
  - "@argos-ci/*"
  - "@modelcontextprotocol/sdk@1.30.0"
